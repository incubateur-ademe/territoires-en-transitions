# Validate non-draft PRs; native upper stack layers defer expensive checks.
# No paths-ignore: the required "ci / status" check must be published on every
# PR, including Markdown-only ones (affected scope is then empty and fast).
name: Pull request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, stacked]

permissions: {}

jobs:
  ci:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    # Evaluate the condition before entering concurrency: title/body edits
    # must not cancel a useful run or replace a pending one.
    concurrency:
      group: pull-request-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/_ci.yml
    permissions:
      actions: read
      contents: read
      packages: write # Prepared test database image.
    secrets: inherit
