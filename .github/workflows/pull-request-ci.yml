# Validate non-draft pull requests through the shared CI workflow.
# No paths-ignore: the required "ci / status" check must be published on every
# PR, including Markdown-only ones (affected scope is then empty and fast).
name: Pull request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/_ci.yml
    permissions:
      actions: read
      contents: read
      packages: write # Prepared test database image.
    secrets: inherit
