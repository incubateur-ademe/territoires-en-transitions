# Retry failed CI jobs once when all failures are limited to known flaky tests and their aggregate.
name: Retry flaky jobs

permissions: {}

on:
  workflow_run:
    workflows: [Main CI, Pull request CI]
    types: [completed]

jobs:
  retry-flaky-jobs:
    # run_attempt == 1 : on ne relance qu'une seule fois
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Relance les jobs échoués si seuls des jobs flaky ont échoué
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          : "${GH_TOKEN:?A GitHub token is required}"
          [[ ${RUN_ID:-} =~ ^[1-9][0-9]*$ ]] || { echo 'A positive workflow run ID is required' >&2; exit 1; }
          [[ ${REPO:-} =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || { echo 'Use a repository in owner/name format' >&2; exit 1; }

          # Préfixes des jobs relançables. Les jobs issus d'un workflow
          # réutilisable sont nommés "<job appelant> / <job appelé>".
          retryable='^ci / (test-backend-api / test-backend-api|test-end-to-end / test-end-to-end \([0-9]+\))$'
          failed_jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .name')

          if [ -z "$failed_jobs" ]; then
            echo "Aucun job en échec, rien à relancer."
            exit 0
          fi

          # L'agrégateur échoue aussi quand un test applicable échoue. Il doit être
          # relancé avec les tests, sans rendre relançable un échec isolé de l'agrégateur.
          if ! echo "$failed_jobs" | grep -Eq "$retryable" || \
             echo "$failed_jobs" | grep -Ev "$retryable" | grep -Evq '^ci / ci-complete$'; then
            echo "Échec en dehors des jobs relançables, pas de retry automatique :"
            echo "$failed_jobs"
            exit 0
          fi

          echo "Seuls des jobs relançables ont échoué, relance des jobs échoués du run $RUN_ID :"
          echo "$failed_jobs"
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
