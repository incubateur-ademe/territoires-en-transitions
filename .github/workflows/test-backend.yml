# Unit test backend
name: test-backend

permissions:
  contents: read

on:
  workflow_call:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-login
        if: ${{ !env.ACT }}
        with:
          password: ${{ secrets.GH_TOKEN }}

      - uses: ./.github/actions/speedup-dpkg

      - name: Create docker network ahead of supabase and redis
        shell: bash
        run: docker network create ${{ vars.SUPABASE_NETWORK }} || true

      - name: Try to restore db volume
        uses: ./.github/actions/db-restore
        with:
          pull: ${{ !env.ACT }}

      - name: Start supabase in background (while installing deps)
        uses: ./.github/actions/supabase-start
        with:
          network: ${{ vars.SUPABASE_NETWORK }}
          background: true

      - uses: ./.github/actions/pnpm-install

      - uses: ./.github/actions/redis-start
        with:
          network: ${{ vars.SUPABASE_NETWORK }}

      - uses: ./.github/actions/app-env
        with:
          app_name: backend
          json_vars: ${{ toJSON(vars) }}
          json_secrets: ${{ toJSON(secrets) }}

      - name: Wait for Supabase
        uses: ./.github/actions/wait-for-url
        with:
          url: ${{ vars.SUPABASE_API_URL }}/rest/v1/
          retry: '60'
          retry_delay: '2'

      - name: Wait for Auth
        uses: ./.github/actions/wait-for-url
        with:
          url: ${{ vars.SUPABASE_API_URL }}/auth/v1/health
          retry: '30'
          retry_delay: '2'

      - run: node -e "console.log('CPU cores:', require('os').cpus().length)"

      # les tests d'import (projet vitest `already-run-by-init-db-seed`) ne sont
      # pas repassés : ils l'ont déjà été lors du seed de la base par init-db
      # le `--` est requis : sans lui, Nx intercepte --project au lieu de Vitest
      - run: >
          pnpm test:backend --
          --project shared-app
