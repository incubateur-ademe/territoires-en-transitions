# Build the selected commit's stack images in parallel and return immutable references.
name: CD / Build

on:
  workflow_call:
    inputs:
      target:
        description: Stack environment
        type: string
        required: true
      force-rebuild:
        description: Rebuild images even when an attested image already exists
        type: boolean
        default: false
    outputs:
      backend-image:
        description: Backend image pinned by digest
        value: ${{ jobs.build-backend.outputs.image }}
      app-image:
        description: App image pinned by digest
        value: ${{ jobs.build-app.outputs.image }}
      site-image:
        description: Site image pinned by digest
        value: ${{ jobs.build-site.outputs.image }}
      tools-image:
        description: Tools image pinned by digest (empty for omitted tools)
        value: ${{ jobs.build-tools.outputs.image }}

permissions:
  contents: read

jobs:
  build-backend:
    name: Build le backend
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Signature de l'attestation de provenance (cf. docker-build-push).
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/app/build-metadata

      - uses: ./.github/actions/docker/login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/docker/image-path
        with:
          username: incubateur-ademe
          image: tet-backend
          # Une image par commit, pas par (commit, environnement) : c'est ce qui
          # rend la promotion preprod -> prod possible sans rebuild.
          tag: ${{ steps.meta.outputs.git-short-hash }}

      - name: Build et push de l'image backend
        id: build
        uses: ./.github/actions/docker/build-push
        env:
          BRYNTUM_ACCESS_TOKEN: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
        with:
          dockerfile: apps/backend/Dockerfile
          image: ${{ steps.image.outputs.path }}
          cache-scope: tet-backend
          push: ${{ !env.ACT }}
          reuse-image: ${{ !inputs.force-rebuild }}
          signer-workflow: ${{ github.repository }}/.github/workflows/_cd-build.yml
          secrets: |
            bryntum_token=BRYNTUM_ACCESS_TOKEN
          build-args: |
            GIT_SHORT_HASH=${{ steps.meta.outputs.git-short-hash }}
            GIT_COMMIT_TIMESTAMP=${{ steps.meta.outputs.git-commit-timestamp }}
            APPLICATION_VERSION=${{ steps.meta.outputs.application-version }}

  build-app:
    name: Build l'app
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Signature de l'attestation de provenance (cf. docker-build-push).
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/app/build-metadata

      - uses: ./.github/actions/docker/login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/docker/image-path
        with:
          username: incubateur-ademe
          image: tet-app
          # Une image par commit, pas par (commit, environnement) : c'est ce qui
          # rend la promotion preprod -> prod possible sans rebuild.
          tag: ${{ steps.meta.outputs.git-short-hash }}

      - name: Build et push de l'image app
        id: build
        uses: ./.github/actions/docker/build-push
        env:
          BRYNTUM_ACCESS_TOKEN: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        with:
          dockerfile: apps/app/Dockerfile
          image: ${{ steps.image.outputs.path }}
          cache-scope: tet-app
          push: ${{ !env.ACT }}
          reuse-image: ${{ !inputs.force-rebuild }}
          signer-workflow: ${{ github.repository }}/.github/workflows/_cd-build.yml
          secrets: |
            bryntum_token=BRYNTUM_ACCESS_TOKEN
            posthog_api_key=POSTHOG_API_KEY
          # Métadonnées du commit uniquement : tout ce qui est spécifique à un
          # environnement est injecté au déploiement (cf. cd.yml). Les
          # variables POSTHOG_* et GITHUB_* ne servent qu'au téléversement des
          # source maps (nom et version de la release) : sans POSTHOG_API_KEY ni
          # POSTHOG_PROJECT_ID, le build se fait sans téléversement.
          build-args: |
            GIT_SHORT_HASH=${{ steps.meta.outputs.git-short-hash }}
            GIT_COMMIT_TIMESTAMP=${{ steps.meta.outputs.git-commit-timestamp }}
            APPLICATION_VERSION=${{ steps.meta.outputs.application-version }}
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            POSTHOG_HOST=https://eu.posthog.com
            GITHUB_ACTIONS=true
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SERVER_URL=${{ github.server_url }}

  build-site:
    name: Build le site
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/app/build-metadata

      - uses: ./.github/actions/docker/login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/docker/image-path
        with:
          username: incubateur-ademe
          image: tet-site
          tag: ${{ inputs.target }}-${{ steps.meta.outputs.git-short-hash }}

      - name: Build et push de l'image site
        id: build
        uses: ./.github/actions/docker/build-push
        env:
          BRYNTUM_ACCESS_TOKEN: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
        with:
          dockerfile: apps/site/Dockerfile
          image: ${{ steps.image.outputs.path }}
          cache-scope: tet-site
          push: ${{ !env.ACT }}
          secrets: |
            bryntum_token=BRYNTUM_ACCESS_TOKEN
          build-args: |
            STRAPI_KEY=${{ secrets.STRAPI_KEY }}
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
            POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
            AXEPTIO_ID=${{ vars.AXEPTIO_ID }}
            APP_URL=${{ vars.APP_URL }}
            CRISP_WEBSITE_ID=${{ vars.CRISP_WEBSITE_ID }}
            BACKEND_URL=${{ vars.BACKEND_URL }}

  build-tools:
    if: ${{ !startsWith(inputs.target, 'preprod') }}
    name: Build l'api d'automatisation technique
    environment: ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Signature de l'attestation de provenance (cf. docker-build-push).
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/app/build-metadata

      - uses: ./.github/actions/docker/login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/docker/image-path
        with:
          username: incubateur-ademe
          image: tet-tools
          # Une image par commit, pas par (commit, environnement) : c'est ce qui
          # rend la promotion staging -> prod possible sans rebuild.
          tag: ${{ steps.meta.outputs.git-short-hash }}

      - name: Build et push de l'image tools
        id: build
        uses: ./.github/actions/docker/build-push
        env:
          BRYNTUM_ACCESS_TOKEN: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
        with:
          dockerfile: apps/tools/Dockerfile
          image: ${{ steps.image.outputs.path }}
          cache-scope: tet-tools
          push: ${{ !env.ACT }}
          reuse-image: ${{ !inputs.force-rebuild }}
          signer-workflow: ${{ github.repository }}/.github/workflows/_cd-build.yml
          secrets: |
            bryntum_token=BRYNTUM_ACCESS_TOKEN
          build-args: |
            GIT_SHORT_HASH=${{ steps.meta.outputs.git-short-hash }}
            GIT_COMMIT_TIMESTAMP=${{ steps.meta.outputs.git-commit-timestamp }}
            APPLICATION_VERSION=${{ steps.meta.outputs.application-version }}
