name: Déploiement du site

permissions:
  contents: read
  packages: write
  # Signature de l'attestation de provenance (cf. docker-build-push).
  id-token: write
  attestations: write

run-name: Déploiement du site sur ${{ github.event.inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Où déployer
        options:
          - preprod
          - staging
          - prod
      force-rebuild:
        type: boolean
        description: Reconstruire l'image même si ce commit est déjà publié
        default: false

jobs:
  deploy-site:
    name: Déploie le site
    environment:
      name: ${{ github.event.inputs.target }}
      url: ${{ steps.deployment-url.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/app/build-metadata

      - uses: ./.github/actions/docker/login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/docker/image-path
        with:
          username: incubateur-ademe
          image: tet-site
          # Une image par commit, pas par (commit, environnement) : c'est ce qui
          # rend la promotion preprod -> prod possible sans rebuild.
          tag: ${{ steps.meta.outputs.git-short-hash }}

      - name: Build et push de l'image site
        uses: ./.github/actions/docker/build-push
        env:
          BRYNTUM_ACCESS_TOKEN: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
        with:
          dockerfile: apps/site/Dockerfile
          image: ${{ steps.image.outputs.path }}
          cache-scope: tet-site
          push: ${{ !env.ACT }}
          reuse-image: ${{ github.event.inputs.force-rebuild != 'true' }}
          secrets: |
            bryntum_token=BRYNTUM_ACCESS_TOKEN

      - uses: ./.github/actions/providers/koyeb/cli
        with:
          api-key: ${{ secrets.KOYEB_API_KEY }}

      # Toute la configuration du site arrive ici : l'image est la même pour
      # preprod, staging et prod (cf. packages/api/src/public-env.ts).
      - name: Déploie le site sur Koyeb
        env:
          ENV_NAME: ${{ github.event.inputs.target }}
          IMAGE: ${{ steps.image.outputs.path }}
          STRAPI_KEY: ${{ secrets.STRAPI_KEY }}
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          AXEPTIO_ID: ${{ vars.AXEPTIO_ID }}
          APP_URL: ${{ vars.APP_URL }}
          CRISP_WEBSITE_ID: ${{ vars.CRISP_WEBSITE_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: >
          koyeb services update $ENV_NAME-site/front
          --docker "$IMAGE"
          --docker-private-registry-secret ghcr
          --docker-skip-verify
          --env "STRAPI_KEY=$STRAPI_KEY"
          --env "STRAPI_URL=$STRAPI_URL"
          --env "POSTHOG_HOST=$POSTHOG_HOST"
          --env "POSTHOG_KEY=$POSTHOG_KEY"
          --env "AXEPTIO_ID=$AXEPTIO_ID"
          --env "APP_URL=$APP_URL"
          --env "CRISP_WEBSITE_ID=$CRISP_WEBSITE_ID"
          --env "BACKEND_URL=$BACKEND_URL"

      - id: deployment-url
        uses: ./.github/actions/providers/koyeb/get-app-url
        with:
          app-name: ${{ github.event.inputs.target }}-site
          public-url: ${{ vars.SITE_URL }}
