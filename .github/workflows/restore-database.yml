name: Restore manuel de la base de données prod sur l'environnement preprod ou staging
run-name: Restore prod backup sur ${{ inputs.target }} ${{ inputs.backup_date && format('← {0}', inputs.backup_date) || '← dernier backup' }}

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: 'Environnement cible de la restauration.'
        required: true
        default: preprod
        options:
          - preprod
          - staging
      backup_date:
        type: string
        description: 'Date ISO du backup (YYYY-MM-DD). Laisser vide pour utiliser le backup le plus récent.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  restore:
    name: Restore manuel sur ${{ inputs.target }}
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: database-maintenance-${{ inputs.target }}
      cancel-in-progress: false
      queue: max

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install AWS CLI
        uses: ./.github/actions/providers/aws/cli

      - name: Compute restore argument
        id: restore_arg
        env:
          BACKUP_DATE_INPUT: ${{ inputs.backup_date }}
          TARGET: ${{ inputs.target }}
        run: |
          trimmed="$(echo -n "$BACKUP_DATE_INPUT" | tr -d '[:space:]')"
          if [ -z "$trimmed" ]; then
            restore_arg="latest"
            echo "No date provided, will resolve latest backup in S3."
          elif [[ "$trimmed" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            restore_arg="$trimmed"
            echo "Will restore backup for date: $restore_arg"
          else
            echo "::error::Invalid backup_date format: '$BACKUP_DATE_INPUT' (expected YYYY-MM-DD)."
            exit 1
          fi
          echo "restore_arg=$restore_arg" >> "$GITHUB_OUTPUT"
          {
            echo "### Restore $TARGET"
            echo ""
            echo "Argument transmis à \`restore.sh\` : \`$restore_arg\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore backup to ${{ inputs.target }}
        env:
          TARGET: ${{ inputs.target }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PREPROD_DB_URL: ${{ secrets.PREPROD_DB_URL }}
          RESTORE_ENCRYPTED_PASSWORD: ${{ secrets.RESTORE_ENCRYPTED_PASSWORD }}
          BACKUP_AWS_ACCESS_KEY_ID: ${{ vars.BACKUP_AWS_ACCESS_KEY_ID }}
          BACKUP_AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_REGION: ${{ vars.BACKUP_REGION }}
          BACKUP_ENDPOINT_URL: ${{ vars.BACKUP_ENDPOINT_URL }}
          RESTORE_ARGUMENT: ${{ steps.restore_arg.outputs.restore_arg }}
        run: |
          case "$TARGET" in
            staging) TO_DB_URL="$STAGING_DB_URL" ;;
            preprod) TO_DB_URL="$PREPROD_DB_URL" ;;
            *) echo "::error::Unknown target '$TARGET'"; exit 1 ;;
          esac
          if [ -z "$TO_DB_URL" ]; then
            echo "::error::Empty DB URL for target '$TARGET'"
            exit 1
          fi
          unset STAGING_DB_URL PREPROD_DB_URL
          export TO_DB_URL
          bash data_layer/backup/restore.sh "$RESTORE_ARGUMENT"
