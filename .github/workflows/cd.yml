# Dispatch a stack deployment; validate the target and require CI only for production.
name: Déploiement groupé
run-name: Déploiement de ${{ github.ref_name }} sur ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Environnement de la stack complète
        default: staging
        options: [staging, staging-test, preprod, preprod-test, prod]
      force-rebuild:
        type: boolean
        description: Reconstruire les images même si ce commit est déjà publié
        default: false

permissions:
  contents: read

jobs:
  validate-request:
    outputs:
      parent: ${{ steps.target.outputs.parent }}
      is-test: ${{ steps.target.outputs.is-test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the source and target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging|preprod|prod) is_test=false ;;
            staging-test|preprod-test) is_test=true ;;
            *) echo '::error::Unknown deployment target.'; exit 1 ;;
          esac
          echo "parent=${TARGET%-test}" >> "$GITHUB_OUTPUT"
          echo "is-test=$is_test" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_REF" == refs/heads/* ]]
          if [[ "$TARGET" == prod && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Production deployments must run from main.'
            exit 1
          fi

  ci:
    needs: validate-request
    if: ${{ inputs.target == 'prod' }}
    uses: ./.github/workflows/_ci.yml
    permissions:
      actions: read
      contents: read
      packages: write
    secrets: inherit

  build:
    needs: [validate-request, ci]
    # Non-production deliberately skips CI; failed or cancelled production CI still blocks builds.
    if: >-
      ${{ !cancelled() && needs.validate-request.result == 'success' &&
          (needs.ci.result == 'success' ||
            (inputs.target != 'prod' && needs.ci.result == 'skipped')) }}
    uses: ./.github/workflows/_cd-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      target: ${{ inputs.target }}
      force-rebuild: ${{ inputs.force-rebuild }}
    secrets: inherit

  deploy:
    needs: [validate-request, build]
    if: ${{ !cancelled() && needs.validate-request.result == 'success' && needs.build.result == 'success' }}
    uses: ./.github/workflows/_cd-deploy.yml
    with:
      target: ${{ inputs.target }}
      parent: ${{ needs.validate-request.outputs.parent }}
      is-test: ${{ needs.validate-request.outputs.is-test == 'true' }}
      backend-image: ${{ needs.build.outputs.backend-image }}
      app-image: ${{ needs.build.outputs.app-image }}
      site-image: ${{ needs.build.outputs.site-image }}
      tools-image: ${{ needs.build.outputs.tools-image }}
    secrets: inherit
