name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-workspace:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.deps-metadata.outputs.cache-key }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute dependency cache key
        id: deps-metadata
        run: echo "cache-key=${{ runner.os }}-node-24.18.0-pnpm-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Check dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ steps.deps-metadata.outputs.cache-key }}
          lookup-only: true

      - name: Install dependencies on cache miss
        if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/pnpm-install
        with:
          bryntum_access_token: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}

      - name: Save dependency cache
        if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.deps-metadata.outputs.cache-key }}

  node-quality:
    needs: [prepare-workspace]
    uses: ./.github/workflows/test-node-quality.yml
    with:
      pnpm_cache_key: ${{ needs.prepare-workspace.outputs.cache-key }}

  test-build-projects:
    needs: [prepare-workspace]
    uses: ./.github/workflows/test-build-projects.yml
    with:
      pnpm_cache_key: ${{ needs.prepare-workspace.outputs.cache-key }}
    secrets: inherit

  prepare-test-db:
    needs: [prepare-workspace]
    uses: ./.github/workflows/prepare-test-db.yml
    with:
      pnpm_cache_key: ${{ needs.prepare-workspace.outputs.cache-key }}
    secrets: inherit

  test-backend-api:
    needs: [prepare-workspace, prepare-test-db]
    uses: ./.github/workflows/test-backend-api.yml
    with:
      pnpm_cache_key: ${{ needs.prepare-workspace.outputs.cache-key }}
    secrets: inherit

  test-db-deploy:
    needs: [prepare-test-db]
    uses: ./.github/workflows/test-db-deploy.yml
    secrets: inherit

  test-end-to-end:
    needs: [prepare-workspace, prepare-test-db]
    uses: ./.github/workflows/test-end-to-end.yml
    with:
      pnpm_cache_key: ${{ needs.prepare-workspace.outputs.cache-key }}
    secrets: inherit
