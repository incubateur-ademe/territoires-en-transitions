# Select affected projects and orchestrate their CI checks.
name: _CI

permissions:
  actions: read
  contents: read

on:
  workflow_call:

jobs:
  analyze-affected:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.deps-metadata.outputs.cache-key }}
      nx-cloud-token-secret-type: ${{ steps.scope.outputs.nx-cloud-token-secret-type }}
      nx-base: ${{ steps.scope.outputs.nx-base }}
      nx-head: ${{ steps.scope.outputs.nx-head }}
      affected-projects: ${{ steps.scope.outputs.affected-projects }}
      run-backend-api: ${{ steps.scope.outputs.run-backend-api }}
      run-backend: ${{ steps.scope.outputs.run-backend }}
      run-api: ${{ steps.scope.outputs.run-api }}
      run-db-deploy: ${{ steps.scope.outputs.run-db-deploy }}
      run-e2e: ${{ steps.scope.outputs.run-e2e }}
      run-ui-storybook: ${{ steps.scope.outputs.run-ui-storybook }}
      run-app-storybook: ${{ steps.scope.outputs.run-app-storybook }}
      run-prepare-test-db: ${{ steps.scope.outputs.run-prepare-test-db }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Compute dependency cache key
        id: deps-metadata
        run: echo "cache-key=${{ runner.os }}-node-24.18.0-pnpm-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}" >> "$GITHUB_OUTPUT"

      - name: Check dependency cache
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.deps-metadata.outputs.cache-key }}
          lookup-only: true

      - name: Install dependencies on cache miss
        if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/pnpm-prepare
        with:
          bryntum-access-token: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}

      - name: Save dependency cache
        if: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.deps-metadata.outputs.cache-key }}

      - uses: ./.github/actions/pnpm-prepare
        with:
          cache-key: ${{ steps.deps-metadata.outputs.cache-key }}

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          workflow-id: main-ci.yml

      - uses: ./.github/actions/compute-affected-scope
        id: scope
        with:
          default-branch: ${{ github.event.repository.default_branch }}

  validate-affected-projects:
    needs: [analyze-affected]
    permissions:
      contents: read
    uses: ./.github/workflows/_ci-validate.yml
    with:
      nx-cloud-token-secret-type: ${{ needs.analyze-affected.outputs.nx-cloud-token-secret-type }}
      pnpm-cache-key: ${{ needs.analyze-affected.outputs.cache-key }}
      nx-base: ${{ needs.analyze-affected.outputs.nx-base }}
      nx-head: ${{ needs.analyze-affected.outputs.nx-head }}
    secrets: inherit

  storybook:
    if: ${{ needs.analyze-affected.outputs.run-ui-storybook == 'true' || needs.analyze-affected.outputs.run-app-storybook == 'true' }}
    needs: [analyze-affected]
    permissions:
      contents: read
    uses: ./.github/workflows/_ci-storybook.yml
    with:
      nx-cloud-token-secret-type: ${{ needs.analyze-affected.outputs.nx-cloud-token-secret-type }}
      pnpm-cache-key: ${{ needs.analyze-affected.outputs.cache-key }}
      run-ui: ${{ needs.analyze-affected.outputs.run-ui-storybook == 'true' }}
      run-app: ${{ needs.analyze-affected.outputs.run-app-storybook == 'true' }}
    secrets: inherit

  prepare-test-db:
    if: ${{ needs.analyze-affected.outputs.run-prepare-test-db == 'true' }}
    needs: [analyze-affected]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_prepare-test-db.yml
    with:
      nx-cloud-token-secret-type: ${{ needs.analyze-affected.outputs.nx-cloud-token-secret-type }}
      pnpm-cache-key: ${{ needs.analyze-affected.outputs.cache-key }}
    secrets: inherit

  test-db-deploy:
    if: ${{ needs.analyze-affected.outputs.run-db-deploy == 'true' }}
    needs: [analyze-affected, prepare-test-db]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_ci-test-db.yml
    secrets: inherit

  test-backend-api:
    if: ${{ needs.analyze-affected.outputs.run-backend-api == 'true' }}
    needs: [analyze-affected, prepare-test-db]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_ci-test-backend-api.yml
    with:
      nx-cloud-token-secret-type: ${{ needs.analyze-affected.outputs.nx-cloud-token-secret-type }}
      pnpm-cache-key: ${{ needs.analyze-affected.outputs.cache-key }}
      run-backend: ${{ needs.analyze-affected.outputs.run-backend == 'true' }}
      run-api: ${{ needs.analyze-affected.outputs.run-api == 'true' }}
    secrets: inherit

  test-end-to-end:
    if: ${{ needs.analyze-affected.outputs.run-e2e == 'true' }}
    needs: [analyze-affected, prepare-test-db]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/_ci-test-e2e.yml
    with:
      nx-cloud-token-secret-type: ${{ needs.analyze-affected.outputs.nx-cloud-token-secret-type }}
      pnpm-cache-key: ${{ needs.analyze-affected.outputs.cache-key }}
    secrets: inherit
