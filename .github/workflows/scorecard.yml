# OpenSSF Scorecard : note les pratiques de sécurité du dépôt (protection de
# main, permissions des workflows, dépendances épinglées, revue de code…).
#
# Les résultats arrivent dans l'onglet Security (code scanning) et sont publiés
# sur scorecard.dev, d'où vient le badge du README.
#
# publish_results impose des contraintes à ce fichier, vérifiées par l'API
# Scorecard : aucune permission d'écriture au niveau du workflow, et un job
# limité aux actions checkout, scorecard-action et upload-sarif.
name: OpenSSF Scorecard

on:
  # Le check Branch-Protection se recalcule quand les règles changent.
  branch_protection_rule:
  schedule:
    - cron: '27 5 * * 1'
  # Premier résultat à la fusion, puis à chaque modification de ce workflow.
  push:
    branches: [main]
    paths: [.github/workflows/scorecard.yml]

permissions: {}

jobs:
  analysis:
    name: Analyse Scorecard
    # Scorecard n'analyse que la branche par défaut.
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Téléversement du SARIF dans code scanning.
      security-events: write
      # Jeton OIDC qui authentifie la publication des résultats.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
