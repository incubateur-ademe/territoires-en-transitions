# Node quality checks
name: Test node quality

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      pnpm_cache_key:
        required: true
        type: string

jobs:
  node-quality:
    environment: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-restore
        with:
          cache_key: ${{ inputs.pnpm_cache_key }}

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-node-quality-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'package.json', 'tsconfig.base.json', 'tsconfig.json', 'vitest.config.ts', 'vitest.workspace.ts', 'eslint.config.mjs', 'eslint-frontend.config.mjs', 'eslint-nextjs.config.mjs', 'apps/**', 'packages/**', 'e2e/**', 'scripts/**', '!**/dist/**', '!**/.next/**', '!**/coverage/**', '!**/storybook-static/**') }}
          restore-keys: |
            nx-node-quality-${{ hashFiles('pnpm-lock.yaml', 'nx.json', 'package.json', 'tsconfig.base.json', 'tsconfig.json', 'vitest.config.ts', 'vitest.workspace.ts', 'eslint.config.mjs', 'eslint-frontend.config.mjs', 'eslint-nextjs.config.mjs') }}-

      - parallel:
          - name: Lint all projects
            run: pnpm nx run-many -t lint -- --quiet

          - name: Type check all projects
            run: pnpm nx run-many -t typecheck --parallel=2

          - name: Unit test main app
            run: pnpm test:app

          - name: Unit test tools
            run: pnpm test:tools
            env:
              SIRENE_API_KEY: ${{ secrets.SIRENE_API_KEY }}
              SIRENE_API_URL: ${{ vars.SIRENE_API_URL }}
