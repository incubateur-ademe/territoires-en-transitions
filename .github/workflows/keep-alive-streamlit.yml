name: Keep Streamlit app alive

permissions:
  contents: read

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm install
        uses: ./.github/actions/pnpm-prepare
        with:
          bryntum-access-token: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}

      - name: Install Playwright browsers
        uses: ./.github/actions/cache/playwright-browsers

      - name: Visit Streamlit app and wake if sleeping
        run: node --experimental-strip-types .github/workflows/scripts/keep-alive-streamlit.ts
