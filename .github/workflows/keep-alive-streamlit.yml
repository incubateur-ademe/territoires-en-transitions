# Keep the site's embedded Streamlit applications awake.
name: Keep Streamlit app alive

permissions:
  contents: read

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep Streamlit apps alive
        uses: ./.github/actions/keep-alive-streamlit
        with:
          bryntum-access-token: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
