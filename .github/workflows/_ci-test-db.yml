# Test database migrations, restore compatibility and constraints against local Supabase.
name: _CI / Database tests

permissions:
  contents: read
  packages: read

on:
  workflow_call:

jobs:
  test-db-deploy:
    name: Test database deployment lifecycle
    runs-on: ubuntu-latest
    env:
      # Sqitch tag used as the starting point for revert/deploy tests.
      tag: v5.0.0

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker/login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start supabase
        id: start
        uses: ./.github/actions/database/supabase/start
        with:
          network: ${{ vars.SUPABASE_NETWORK }}
          pull: ${{ !env.ACT }}

      - name: Bind database tests to the local Supabase container
        id: local-supabase
        env:
          DATABASE_URL: postgresql://postgres:postgres@supabase_db_tet:5432/postgres
          SUPABASE_NETWORK: ${{ vars.SUPABASE_NETWORK }}
        run: |
          set -euo pipefail

          container_id="$(docker inspect --format '{{.Id}}' supabase_db_tet)"
          if [[ "$(docker inspect --format '{{.State.Running}}' supabase_db_tet)" != 'true' ]]; then
            echo "::error::Le conteneur Supabase local n'est pas démarré."
            exit 2
          fi

          attached_container_ip=''
          while IFS='|' read -r attached_container_id attached_container_cidr; do
            if [[ "$attached_container_id" == "$container_id" ]]; then
              attached_container_ip="${attached_container_cidr%%/*}"
              break
            fi
          done < <(
            docker network inspect \
              --format '{{range $id, $container := .Containers}}{{$id}}|{{$container.IPv4Address}}{{"\n"}}{{end}}' \
              "$SUPABASE_NETWORK"
          )
          if [[ -z "$attached_container_ip" ]]; then
            echo "::error::Le conteneur Supabase local n'est pas rattaché au réseau $SUPABASE_NETWORK."
            exit 2
          fi

          postgres_image="$(docker inspect --format '{{.Config.Image}}' supabase_db_tet)"
          connection_identity="$(
            docker run \
              --rm \
              --network "$SUPABASE_NETWORK" \
              --env DATABASE_URL \
              --entrypoint psql \
              "$postgres_image" \
              "$DATABASE_URL" \
              --no-psqlrc \
              --tuples-only \
              --no-align \
              --set ON_ERROR_STOP=1 \
              --command "select current_database() || '|' || host(inet_server_addr())"
          )"
          if [[ "$connection_identity" != "postgres|$attached_container_ip" ]]; then
            echo '::error::La cible PostgreSQL ne correspond pas au conteneur Supabase local démarré.'
            exit 2
          fi

          echo "database-url=$DATABASE_URL" >> "$GITHUB_OUTPUT"
          echo "sqitch-target=db:pg://${DATABASE_URL#postgresql://}" >> "$GITHUB_OUTPUT"

      - name: Test periodicity catalogue migration in an empty disposable database
        env:
          SCHEMA_DATABASE_NAME: periodicite_schema_test_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker exec --env PGPASSWORD=postgres supabase_db_tet \
            createdb --host=127.0.0.1 --username=postgres --owner=postgres "$SCHEMA_DATABASE_NAME"
          trap 'docker exec --env PGPASSWORD=postgres supabase_db_tet dropdb --host=127.0.0.1 --username=postgres --if-exists --force "$SCHEMA_DATABASE_NAME"' EXIT
          docker run \
            --rm \
            --network container:supabase_db_tet \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --entrypoint pg_prove \
            "${SUPABASE_INTERNAL_IMAGE_REGISTRY:-public.ecr.aws}/supabase/pg_prove:3.36" \
            --dbname="postgresql://postgres:postgres@127.0.0.1:5432/$SCHEMA_DATABASE_NAME" \
            --ext .psql --verbose data_layer/tests/indicateur/periodicite-schema.assertions.psql

      - name: Sqitch revert to ${{ env.tag }}
        if: ${{ !env.ACT }}
        uses: ./.github/actions/database/sqitch
        with:
          command: 'revert --to @${{ env.tag }} --y'
          target: ${{ steps.local-supabase.outputs.sqitch-target }}
          network: ${{ vars.SUPABASE_NETWORK }}

      - name: Sqitch deploy/verify
        if: ${{ !env.ACT }}
        uses: ./.github/actions/database/sqitch
        with:
          command: 'deploy --mode change --verify'
          target: ${{ steps.local-supabase.outputs.sqitch-target }}
          network: ${{ vars.SUPABASE_NETWORK }}

      - name: Sqitch revert to ${{ env.tag }} (local)
        if: ${{ env.ACT }}
        uses: ./.github/actions/database/sqitch-local
        with:
          command: 'revert --to @${{ env.tag }} --y'
          target: ${{ steps.local-supabase.outputs.sqitch-target }}

      - name: Sqitch deploy/verify (local)
        if: ${{ env.ACT }}
        uses: ./.github/actions/database/sqitch-local
        with:
          command: 'deploy --mode change --verify'
          target: ${{ steps.local-supabase.outputs.sqitch-target }}

      - name: Test restore preflight in a disposable database
        env:
          DATABASE_URL: ${{ steps.local-supabase.outputs.database-url }}
        run: |
          set -euo pipefail
          postgres_image="$(docker inspect --format '{{.Config.Image}}' supabase_db_tet)"
          wget -qO "$RUNNER_TEMP/yq" https://github.com/mikefarah/yq/releases/download/v4.53.2/yq_linux_amd64
          chmod +x "$RUNNER_TEMP/yq"
          docker run \
            --rm --interactive \
            --network container:supabase_db_tet \
            --env DATABASE_URL \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/yq:/usr/local/bin/yq:ro" \
            --workdir /workspace \
            --entrypoint bash "$postgres_image" -seuo pipefail <<'BASH'
          set -euo pipefail
          DATABASE_URL="${DATABASE_URL/supabase_db_tet/127.0.0.1}"
          workspace=$(mktemp -d)
          database="restore_preflight_${$}"
          trap 'rm -rf "$workspace"' EXIT
          createdb --maintenance-db="$DATABASE_URL" "$database"
          trap 'dropdb --maintenance-db="$DATABASE_URL" --if-exists "$database"; rm -rf "$workspace"' EXIT
          export TO_DB_URL="${DATABASE_URL%/*}/$database"
          # Only table presence matters before preflight; derive the fixture from the real config.
          tables=$(yq -r '.groups[][]' data_layer/backup/restore-config.yml | sort -u)
          while IFS= read -r table; do
              [[ "$table" == *.* ]] || table="public.$table"
              printf 'CREATE SCHEMA IF NOT EXISTS %s; CREATE TABLE IF NOT EXISTS %s (id integer, value text);\n' "${table%%.*}" "$table"
          done <<< "$tables" | psql -X -v ON_ERROR_STOP=1 --dbname="$TO_DB_URL"
          psql -X -v ON_ERROR_STOP=1 --dbname="$TO_DB_URL" <<'SQL'
          CREATE SCHEMA sqitch;
          CREATE TABLE sqitch.changes (project text, change_id text, script_hash text);
          INSERT INTO sqitch.changes VALUES ('test', repeat('a', 40), repeat('b', 40));
          INSERT INTO public.dcp VALUES (1, 'preserved');
          SQL
          checker=data_layer/backup/check-restore-compatibility.sh
          pg_dump --format=custom --dbname="$TO_DB_URL" --file="$workspace/complete.dump"
          bash "$checker" "$workspace/complete.dump" public.dcp
          expect_refusal() {
              local archive="$1" message="$2"
              if CI=true bash data_layer/backup/restore.sh "$archive" > "$workspace/result" 2>&1; then
                  echo "Preflight unexpectedly accepted $archive" >&2
                  exit 1
              fi
              grep -F "$message" "$workspace/result"
              [[ $(psql -X -At --dbname="$TO_DB_URL" -c "SELECT count(*) = 1 AND bool_and(id = 1 AND value = 'preserved') FROM public.dcp") == t ]]
          }
          pg_dump --format=custom --dbname="$TO_DB_URL" --exclude-table-data=public.dcp \
              --file="$workspace/incomplete.dump"
          expect_refusal "$workspace/incomplete.dump" 'backup lacks TABLE DATA'
          psql -X -v ON_ERROR_STOP=1 --dbname="$TO_DB_URL" \
              -c "UPDATE sqitch.changes SET script_hash = repeat('c', 40)"
          bash "$checker" "$workspace/complete.dump" public.dcp
          psql -X -v ON_ERROR_STOP=1 --dbname="$TO_DB_URL" \
              -c "UPDATE sqitch.changes SET change_id = repeat('c', 40)"
          expect_refusal "$workspace/complete.dump" 'different Sqitch migrations'
          echo 'Preflight: matching registry and changed script_hash accepted; restore.sh refuses missing data and changed change_id without truncating dcp.'
          BASH

      - name: Test periodicity constraints after deployment
        run: |
          docker run \
            --rm \
            --network container:supabase_db_tet \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            --entrypoint pg_prove \
            "${SUPABASE_INTERNAL_IMAGE_REGISTRY:-public.ecr.aws}/supabase/pg_prove:3.36" \
            --dbname=postgresql://postgres:postgres@127.0.0.1:5432/postgres \
            --verbose data_layer/tests/indicateur/periodicite-release.sql \
            data_layer/tests/indicateur/periodicite.sql \
            data_layer/tests/indicateur/periodicite-formules.sql \
            data_layer/tests/indicateur/periodicite-collectivite.sql \
            data_layer/tests/indicateur/definition-nature.sql
