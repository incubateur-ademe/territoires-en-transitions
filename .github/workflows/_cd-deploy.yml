# Migrate and verify the schema, deploy the stack, and retain the maintenance lock through final checks.
name: CD / Deploy

on:
  workflow_call:
    inputs:
      target:
        description: Stack environment
        type: string
        required: true
      backend-image:
        description: Backend image pinned by digest
        type: string
        required: true
      app-image:
        description: App image pinned by digest
        type: string
        required: true
      site-image:
        description: Site image pinned by digest
        type: string
        required: true
      tools-image:
        description: Tools image pinned by digest
        type: string
        default: ''

permissions:
  contents: read

# This lock covers both jobs; separate locks would allow a restore between deployment and checks.
concurrency:
  group: database-maintenance-${{ inputs.target }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Migrate and deploy the complete stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.APP_URL }}
    outputs:
      backend-deployment: ${{ steps.backend.outputs.deployment }}
      app-deployment: ${{ steps.app.outputs.deployment }}
      commit: ${{ steps.meta.outputs.git-short-hash }}
    env:
      ENV_NAME: ${{ inputs.target }}
      SQITCH_FULLNAME: GitHub Actions
      SQITCH_EMAIL: actions@users.noreply.github.com
      PGCONNECT_TIMEOUT: '10'
      PGOPTIONS: '-c lock_timeout=10s -c statement_timeout=10min'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/app/build-metadata

      - name: Validate deployment configuration
        env:
          BACKEND_IMAGE: ${{ inputs.backend-image }}
          APP_IMAGE: ${{ inputs.app-image }}
          SITE_IMAGE: ${{ inputs.site-image }}
          TOOLS_IMAGE: ${{ inputs.tools-image }}
          APP_URL: ${{ vars.APP_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ secrets.API_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.ANON_KEY }}
          TRANSITION_SECONDS: ${{ vars.APP_BACKEND_TRANSITION_TIMEOUT_SECONDS }}
        run: |
          set -euo pipefail
          [[ "$TRANSITION_SECONDS" =~ ^[1-9][0-9]{1,3}$ ]]
          (( TRANSITION_SECONDS <= 1800 ))
          [[ "$SUPABASE_URL" == https://* && -n "$SUPABASE_ANON_KEY" ]]
          for url in "$APP_URL" "$BACKEND_URL" "$SITE_URL"; do
            [[ "$url" == https://* ]] || { echo '::error::Configure the public HTTPS URLs on the target environment.'; exit 1; }
          done
          images=("$BACKEND_IMAGE" "$APP_IMAGE" "$SITE_IMAGE")
          [[ "$ENV_NAME" == preprod ]] || images+=("$TOOLS_IMAGE")
          for image in "${images[@]}"; do
            [[ "$image" =~ ^ghcr\.io/incubateur-ademe/tet-(backend|app|site|tools)@sha256:[a-f0-9]{64}$ ]]
          done
          {
            echo "### Deployment: $ENV_NAME / $GITHUB_SHA"
            echo
            echo '| Service | State | Image / operation |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/providers/koyeb/cli
        with:
          api-key: ${{ secrets.KOYEB_API_KEY }}

      - name: Install migration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqitch libdbd-pg-perl postgresql-client

      - uses: ./.github/actions/providers/aws/cli
        if: ${{ inputs.target == 'prod' }}

      - name: Require a recent production recovery point
        if: ${{ inputs.target == 'prod' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_REGION }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_ENDPOINT_URL: ${{ vars.BACKUP_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?}" "${AWS_SECRET_ACCESS_KEY:?}" "${AWS_DEFAULT_REGION:?}" "${BACKUP_BUCKET:?}" "${BACKUP_ENDPOINT_URL:?}"
          export AWS_CONFIG_FILE="$GITHUB_WORKSPACE/data_layer/backup/aws-config"
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          backups=$(aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --prefix backup- \
            --endpoint-url "$BACKUP_ENDPOINT_URL" --output json)
          latest=$(jq -er '[.Contents[]? | select(.Key | test("^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}\\.dump$")) | select(.Size > 0)] | max_by(.LastModified).LastModified // empty' <<< "$backups")
          age=$(( $(date +%s) - $(date -d "$latest" +%s) ))
          (( age >= 0 && age < 86400 )) || { echo '::error::No production backup younger than 24 hours.'; exit 1; }

      - name: Inspect the current stack before any migration
        env:
          APP_URL: ${{ vars.APP_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -euo pipefail
          services=("$ENV_NAME-backend/backend" "$ENV_NAME-app/front" "$ENV_NAME-site/front")
          [[ "$ENV_NAME" == preprod ]] || services+=("$ENV_NAME-tools-autom-api/tools")
          for service in "${services[@]}"; do
            current=$(timeout --kill-after=5s 30s koyeb services get "$service" --output json)
            if ! jq -e '.status == "HEALTHY" and (.active_deployment_id | length > 0) and .active_deployment_id == .latest_deployment_id' <<< "$current" >/dev/null; then
              echo "::error::$service is unhealthy or has an unresolved deployment. Reconcile it in Koyeb before retrying."
              exit 1
            fi
            deployment=$(jq -r '.active_deployment_id' <<< "$current")
            definition=$(timeout --kill-after=5s 30s koyeb deployments get "$deployment" --output json)
            jq -e '.status == "HEALTHY" and (.definition.docker.image | startswith("ghcr.io/incubateur-ademe/tet-"))' <<< "$definition" >/dev/null
            if [[ "$service" == *-tools-autom-api/tools ]]; then
              # Crisp deduplication is process-local: keep tools in one region at one replica.
              jq -e '.definition | (.regions | length == 1) and (.scalings | length > 0 and all(.min == 1 and .max == 1))' <<< "$definition" >/dev/null
            fi
            printf '| %s | before migration | `%s` |\n' "$service" "$deployment" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$ENV_NAME" == prod ]]; then
            # A run can wait behind a more recent deployment in the maintenance queue.
            for url in "$BACKEND_URL" "$APP_URL"; do
              current_sha=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                -H 'Cache-Control: no-cache' "$url/version?run=$GITHUB_RUN_ID" | jq -er '.commit | select(test("^[a-f0-9]{7,40}$"))')
              current_commit=$(git rev-parse --verify "$current_sha^{commit}")
              git merge-base --is-ancestor "$current_commit" "$GITHUB_SHA" || {
                echo '::error::This production request would move behind a currently deployed commit.'
                exit 1
              }
            done
          fi

      - name: Migrate and verify the target database
        id: migrate
        timeout-minutes: 20
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_HOST: ${{ vars.MIGRATION_DATABASE_HOST }}
        run: |
          set -euo pipefail
          umask 077
          # Keep the password out of process arguments and Sqitch status output.
          python3 - <<'PYTHON'
          import os
          from urllib.parse import urlsplit, unquote
          url = urlsplit(os.environ['MIGRATION_DATABASE_URL'])
          expected_host = os.environ['MIGRATION_DATABASE_HOST']
          if (url.scheme not in ('postgres', 'postgresql') or not expected_host
              or url.hostname != expected_host or (url.port or 5432) != 5432
              or url.path != '/postgres' or not url.username or not url.password
              or url.query or url.fragment):
              raise SystemExit('Invalid migration connection: require the configured host, port 5432, postgres database, credentials and no query/fragment.')
          values = dict(PGHOST=url.hostname, PGPORT='5432', PGDATABASE='postgres',
                        PGUSER=unquote(url.username), PGPASSWORD=unquote(url.password),
                        PGSSLMODE='verify-full', PGSSLROOTCERT='system')
          if any('\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('Invalid multiline database connection value.')
          with open(os.environ['RUNNER_TEMP'] + '/migration-env', 'w') as output:
              import shlex
              for key, value in values.items():
                  output.write(f'export {key}={shlex.quote(value)}\n')
          PYTHON
          chmod 600 "$RUNNER_TEMP/migration-env"
          source "$RUNNER_TEMP/migration-env"
          rm "$RUNNER_TEMP/migration-env"
          unset MIGRATION_DATABASE_URL
          trap 'sqitch status --target db:pg: || true' EXIT
          [[ $(psql --no-psqlrc -At --set ON_ERROR_STOP=1 \
            --command "select count(*) from sqitch.projects where project = 'tet'") == 1 ]]
          sqitch status --target db:pg:
          sqitch check --target db:pg:
          sqitch deploy --target db:pg: --mode change --verify --lock-timeout 60
          sqitch verify --target db:pg:

      - name: Start the backend/app transition clock
        id: transition
        env:
          TRANSITION_SECONDS: ${{ vars.APP_BACKEND_TRANSITION_TIMEOUT_SECONDS }}
        run: |
          started=$(date +%s)
          echo "started=$started" >> "$GITHUB_OUTPUT"
          echo "deadline=$((started + TRANSITION_SECONDS))" >> "$GITHUB_OUTPUT"

      - name: Deploy backend
        id: backend
        uses: ./.github/actions/providers/koyeb/deploy
        with:
          service: ${{ inputs.target }}-backend/backend
          image: ${{ inputs.backend-image }}
          deadline: ${{ steps.transition.outputs.deadline }}
          url: ${{ vars.BACKEND_URL }}/version
          commit: ${{ steps.meta.outputs.git-short-hash }}
          environment: |
            ENV_NAME=${{ inputs.target }}
            DEPLOYMENT_TIMESTAMP=${{ steps.meta.outputs.deployment-timestamp }}
            GCLOUD_SERVICE_ACCOUNT_KEY=@GCLOUD_SERVICE_ACCOUNT_KEY
            GOOGLE_CLOUD_PROJECT=tet-gcloud
            GOOGLE_CLOUD_LOCATION=eu
            GEMINI_MODEL=gemini-3.5-flash
            LLM_PROVIDER=albert
            ALBERT_API_KEY=@ALBERT_API_KEY
            ALBERT_MAX_CONCURRENT_CALLS=5
            ALBERT_MODEL=gpt-oss-120b
            ALBERT_MODEL_LIGHT=ministral-3-8b-instruct-2512
            ALBERT_MODEL_OCR=lightonocr-2-1b
            SUPABASE_DATABASE_URL=@SUPABASE_DATABASE_URL_${{ inputs.target }}
            SUPABASE_URL=@SUPABASE_URL_${{ inputs.target }}
            SUPABASE_SERVICE_ROLE_KEY=@SUPABASE_SERVICE_ROLE_KEY_${{ inputs.target }}
            SUPABASE_JWT_SECRET=@SUPABASE_JWT_SECRET_${{ inputs.target }}
            SUPABASE_ANON_KEY=@SUPABASE_ANON_KEY_${{ inputs.target }}
            TRAJECTOIRE_SNBC_SHEET_ID=${{ vars.TRAJECTOIRE_SNBC_SHEET_ID }}
            TRAJECTOIRE_SNBC_XLSX_ID=${{ vars.TRAJECTOIRE_SNBC_XLSX_ID }}
            TRAJECTOIRE_SNBC_RESULT_FOLDER_ID=${{ vars.TRAJECTOIRE_SNBC_RESULT_FOLDER_ID }}
            BREVO_API_KEY=@BREVO_API_KEY
            REFERENTIEL_TE_SHEET_ID=${{ vars.REFERENTIEL_TE_SHEET_ID }}
            REFERENTIEL_CAE_SHEET_ID=${{ vars.REFERENTIEL_CAE_SHEET_ID }}
            REFERENTIEL_ECI_SHEET_ID=${{ vars.REFERENTIEL_ECI_SHEET_ID }}
            PERSONNALISATION_QUESTIONS_SHEET_ID=${{ vars.PERSONNALISATION_QUESTIONS_SHEET_ID }}
            INDICATEUR_DEFINITIONS_SHEET_ID=${{ vars.INDICATEUR_DEFINITIONS_SHEET_ID }}
            QUEUE_REDIS_HOST=@QUEUE_REDIS_HOST_${{ inputs.target }}
            OTEL_EXPORTER_OTLP_ENDPOINT=https://eu.i.posthog.com/i
            OTEL_SERVICE_NAME=backend
            OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=${{ inputs.target }}

      - name: Deploy app
        id: app
        uses: ./.github/actions/providers/koyeb/deploy
        with:
          service: ${{ inputs.target }}-app/front
          image: ${{ inputs.app-image }}
          deadline: ${{ steps.transition.outputs.deadline }}
          url: ${{ vars.APP_URL }}/version
          commit: ${{ steps.meta.outputs.git-short-hash }}
          environment: |
            POSTHOG_HOST=@POSTHOG_HOST
            POSTHOG_KEY=@POSTHOG_KEY
            DEPLOYMENT_TIMESTAMP=${{ steps.meta.outputs.deployment-timestamp }}
            ENV_NAME=${{ inputs.target }}
            SUPABASE_URL=${{ secrets.API_URL }}
            SUPABASE_ANON_KEY=${{ secrets.ANON_KEY }}
            BACKEND_URL=${{ vars.BACKEND_URL }}
            APP_URL=${{ vars.APP_URL }}
            CRISP_WEBSITE_ID=${{ vars.CRISP_WEBSITE_ID }}

      - name: Record the backend/app transition duration
        env:
          STARTED: ${{ steps.transition.outputs.started }}
        run: echo "Backend/app ready after $(($(date +%s) - STARTED)) seconds." >> "$GITHUB_STEP_SUMMARY"

      # Observe both services after the pair is deployed, never between their updates.
      - parallel:
          - name: Observe backend stability
            uses: ./.github/actions/providers/koyeb/wait-for-service
            with:
              service: ${{ inputs.target }}-backend/backend
              deployment: ${{ steps.backend.outputs.deployment }}
              image: ${{ inputs.backend-image }}
              stability-seconds: '30'
              url: ${{ vars.BACKEND_URL }}/version
              commit: ${{ steps.meta.outputs.git-short-hash }}

          - name: Observe app stability
            uses: ./.github/actions/providers/koyeb/wait-for-service
            with:
              service: ${{ inputs.target }}-app/front
              deployment: ${{ steps.app.outputs.deployment }}
              image: ${{ inputs.app-image }}
              stability-seconds: '30'
              url: ${{ vars.APP_URL }}/version
              commit: ${{ steps.meta.outputs.git-short-hash }}

      - name: Start the site deadline
        id: site-deadline
        run: echo "deadline=$(($(date +%s) + 600))" >> "$GITHUB_OUTPUT"

      - name: Deploy site
        id: site
        uses: ./.github/actions/providers/koyeb/deploy
        with:
          service: ${{ inputs.target }}-site/front
          image: ${{ inputs.site-image }}
          deadline: ${{ steps.site-deadline.outputs.deadline }}

      - name: Start the tools deadline
        id: tools-deadline
        if: ${{ inputs.target != 'preprod' }}
        run: echo "deadline=$(($(date +%s) + 600))" >> "$GITHUB_OUTPUT"

      - name: Deploy tools
        id: tools
        if: ${{ inputs.target != 'preprod' }}
        uses: ./.github/actions/providers/koyeb/deploy
        with:
          service: ${{ inputs.target }}-tools-autom-api/tools
          image: ${{ inputs.tools-image }}
          deadline: ${{ steps.tools-deadline.outputs.deadline }}
          strategy: immediate
          environment: |
            ENV_NAME=${{ inputs.target }}
            DEPLOYMENT_TIMESTAMP=${{ steps.meta.outputs.deployment-timestamp }}
            CRISP_TOKEN_IDENTIFIER=@CRISP_TOKEN_IDENTIFIER_${{ inputs.target }}
            CRISP_TOKEN_KEY=@CRISP_TOKEN_KEY_${{ inputs.target }}
            NOTION_TOKEN=@NOTION_TOKEN_${{ inputs.target }}
            NOTION_BUG_SUPPORT_DATABASE_ID=@NOTION_BUG_SUPPORT_DATABASE_ID_${{ inputs.target }}
            NOTION_BUG_TEMPLATE_ID=@NOTION_BUG_TEMPLATE_ID_${{ inputs.target }}
            NOTION_SUPPORT_TEMPLATE_ID=@NOTION_SUPPORT_TEMPLATE_ID_${{ inputs.target }}
            TET_API_URL=@TET_API_URL_${{ inputs.target }}
            TET_API_TOKEN=@SUPABASE_SERVICE_ROLE_KEY_${{ inputs.target }}
            EXTERNAL_SYSTEM_SECRET_MAP=@EXTERNAL_SYSTEM_SECRET_MAP_${{ inputs.target }}
            SUPABASE_DATABASE_URL=@SUPABASE_DATABASE_URL_${{ inputs.target }}
            QUEUE_REDIS_HOST=@QUEUE_REDIS_HOST_${{ inputs.target }}
            AIRTABLE_PERSONAL_ACCESS_TOKEN=@AIRTABLE_PERSONAL_ACCESS_TOKEN
            AIRTABLE_IMPORT_DATABASE_ID=@AIRTABLE_IMPORT_DATABASE_ID
            AIRTABLE_CRM_DATABASE_ID=@AIRTABLE_CRM_DATABASE_ID
            AIRTABLE_CRM_FEEDBACKS_TABLE_ID=@AIRTABLE_CRM_FEEDBACKS_TABLE_ID
            AIRTABLE_CRM_USERS_TABLE_ID=@AIRTABLE_CRM_USERS_TABLE_ID
            APP_URL=${{ vars.APP_URL }}
            OTEL_EXPORTER_OTLP_ENDPOINT=https://eu.i.posthog.com/i
            OTEL_SERVICE_NAME=tools
            OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=${{ inputs.target }}

      - name: Report incomplete deployment
        if: ${{ failure() || cancelled() }}
        run: |
          echo '::error::Deployment incomplete. No automatic database or application rollback was attempted. Inspect Sqitch and every Koyeb service before retrying; remote operations can outlive this job.'
          echo 'Deployment incomplete. Inspect the operation IDs above and the target database before any retry or restore.' >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: deploy
    uses: ./.github/workflows/_cd-check.yml
    with:
      target: ${{ inputs.target }}
      backend-image: ${{ inputs.backend-image }}
      app-image: ${{ inputs.app-image }}
      backend-deployment: ${{ needs.deploy.outputs.backend-deployment }}
      app-deployment: ${{ needs.deploy.outputs.app-deployment }}
      commit: ${{ needs.deploy.outputs.commit }}
    secrets: inherit
