name: Déploiement à la demande du backend

permissions:
  contents: read

run-name: Déploiement du backend sur ${{ github.event.inputs.target }}

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Quel environnement ?
        options:
          - preprod
          - staging
          - prod
      is-test-backend:
        type: boolean
        description: Backend de test

jobs:
  build-backend:
    name: Build le backend
    environment: ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.path }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: meta
        uses: ./.github/actions/build-metadata

      - uses: ./.github/actions/docker-login
        if: ${{ !env.ACT }}
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        uses: ./.github/actions/docker-image-path
        with:
          username: incubateur-ademe
          image: tet-backend
          tag: ${{ github.event.inputs.target }}-${{ steps.meta.outputs.git-short-hash }}

      - name: Build et push de l'image backend
        uses: ./.github/actions/docker-build-push
        env:
          BRYNTUM_ACCESS_TOKEN: ${{ secrets.BRYNTUM_ACCESS_TOKEN }}
        with:
          dockerfile: apps/backend/Dockerfile
          image: ${{ steps.image.outputs.path }}
          cache-scope: tet-backend
          push: ${{ !env.ACT }}
          secrets: |
            bryntum_token=BRYNTUM_ACCESS_TOKEN
          build-args: |
            GIT_SHORT_HASH=${{ steps.meta.outputs.git-short-hash }}
            GIT_COMMIT_TIMESTAMP=${{ steps.meta.outputs.git-commit-timestamp }}
            APPLICATION_VERSION=${{ steps.meta.outputs.application-version }}

  deploy-backend:
    name: Déploie le backend
    if: ${{ github.event.inputs.is-test-backend != 'true' }}
    needs: build-backend
    environment: ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: meta
        uses: ./.github/actions/build-metadata

      - uses: ./.github/actions/koyeb-cli
        with:
          api-key: ${{ secrets.KOYEB_API_KEY }}

      - name: Déploie le backend sur Koyeb
        env:
          ENV_NAME: ${{ github.event.inputs.target }}
          IMAGE: ${{ needs.build-backend.outputs.image }}
          DEPLOYMENT_TIMESTAMP: ${{ steps.meta.outputs.deployment-timestamp }}
        run: >
          koyeb services update $ENV_NAME-backend/backend
          --debug
          --docker "$IMAGE"
          --docker-private-registry-secret ghcr
          --env ENV_NAME=$ENV_NAME
          --env DEPLOYMENT_TIMESTAMP=$DEPLOYMENT_TIMESTAMP
          --env GCLOUD_SERVICE_ACCOUNT_KEY=@GCLOUD_SERVICE_ACCOUNT_KEY
          --env SUPABASE_DATABASE_URL=@SUPABASE_DATABASE_URL_$ENV_NAME
          --env SUPABASE_URL=@SUPABASE_URL_$ENV_NAME
          --env SUPABASE_SERVICE_ROLE_KEY=@SUPABASE_SERVICE_ROLE_KEY_$ENV_NAME
          --env SUPABASE_JWT_SECRET=@SUPABASE_JWT_SECRET_$ENV_NAME
          --env SUPABASE_ANON_KEY=@SUPABASE_ANON_KEY_$ENV_NAME
          --env TRAJECTOIRE_SNBC_SHEET_ID=${{ vars.TRAJECTOIRE_SNBC_SHEET_ID }}
          --env TRAJECTOIRE_SNBC_XLSX_ID=${{ vars.TRAJECTOIRE_SNBC_XLSX_ID }}
          --env TRAJECTOIRE_SNBC_RESULT_FOLDER_ID=${{ vars.TRAJECTOIRE_SNBC_RESULT_FOLDER_ID }}
          --env MATTERMOST_NOTIFICATIONS_WEBHOOK_URL=@MATTERMOST_NOTIFICATIONS_WEBHOOK_URL_$ENV_NAME
          --env BREVO_API_KEY=@BREVO_API_KEY
          --env REFERENTIEL_TE_SHEET_ID=${{ vars.REFERENTIEL_TE_SHEET_ID }}
          --env REFERENTIEL_CAE_SHEET_ID=${{ vars.REFERENTIEL_CAE_SHEET_ID }}
          --env REFERENTIEL_ECI_SHEET_ID=${{ vars.REFERENTIEL_ECI_SHEET_ID }}
          --env PERSONNALISATION_QUESTIONS_SHEET_ID=${{ vars.PERSONNALISATION_QUESTIONS_SHEET_ID }}
          --env INDICATEUR_DEFINITIONS_SHEET_ID=${{ vars.INDICATEUR_DEFINITIONS_SHEET_ID }}
          --env QUEUE_REDIS_HOST=@QUEUE_REDIS_HOST_$ENV_NAME

  deploy-test-backend:
    name: Déploie le backend de test
    if: ${{ github.event.inputs.is-test-backend == 'true' }}
    needs: build-backend
    environment: ${{ github.event.inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: meta
        uses: ./.github/actions/build-metadata

      - uses: ./.github/actions/koyeb-cli
        with:
          api-key: ${{ secrets.KOYEB_API_KEY }}

      - name: Déploie le backend de test sur Koyeb
        env:
          ENV_NAME: ${{ github.event.inputs.target }}
          IMAGE: ${{ needs.build-backend.outputs.image }}
          SERVICE_NAME: test-${{ github.event.inputs.target }}-backend
          DEPLOYMENT_TIMESTAMP: ${{ steps.meta.outputs.deployment-timestamp }}
        run: >
          koyeb services update $SERVICE_NAME/backend
          --debug
          --docker "$IMAGE"
          --docker-private-registry-secret ghcr
          --env ENV_NAME=$ENV_NAME
          --env DEPLOYMENT_TIMESTAMP=$DEPLOYMENT_TIMESTAMP
          --env GCLOUD_SERVICE_ACCOUNT_KEY=@GCLOUD_SERVICE_ACCOUNT_KEY
          --env SUPABASE_DATABASE_URL=@SUPABASE_DATABASE_URL_$ENV_NAME
          --env SUPABASE_URL=@SUPABASE_URL_$ENV_NAME
          --env SUPABASE_SERVICE_ROLE_KEY=@SUPABASE_SERVICE_ROLE_KEY_$ENV_NAME
          --env SUPABASE_JWT_SECRET=@SUPABASE_JWT_SECRET_$ENV_NAME
          --env SUPABASE_ANON_KEY=@SUPABASE_ANON_KEY_$ENV_NAME
          --env TRAJECTOIRE_SNBC_SHEET_ID=${{ vars.TRAJECTOIRE_SNBC_SHEET_ID }}
          --env TRAJECTOIRE_SNBC_XLSX_ID=${{ vars.TRAJECTOIRE_SNBC_XLSX_ID }}
          --env TRAJECTOIRE_SNBC_RESULT_FOLDER_ID=${{ vars.TRAJECTOIRE_SNBC_RESULT_FOLDER_ID }}
          --env MATTERMOST_NOTIFICATIONS_WEBHOOK_URL=@MATTERMOST_NOTIFICATIONS_WEBHOOK_URL_$ENV_NAME
          --env BREVO_API_KEY=@BREVO_API_KEY
          --env REFERENTIEL_TE_SHEET_ID=${{ vars.REFERENTIEL_TE_SHEET_ID }}
          --env REFERENTIEL_CAE_SHEET_ID=${{ vars.REFERENTIEL_CAE_SHEET_ID }}
          --env REFERENTIEL_ECI_SHEET_ID=${{ vars.REFERENTIEL_ECI_SHEET_ID }}
          --env PERSONNALISATION_QUESTIONS_SHEET_ID=${{ vars.PERSONNALISATION_QUESTIONS_SHEET_ID }}
          --env INDICATEUR_DEFINITIONS_SHEET_ID=${{ vars.INDICATEUR_DEFINITIONS_SHEET_ID }}
          --env QUEUE_REDIS_HOST=@QUEUE_REDIS_HOST_$ENV_NAME
