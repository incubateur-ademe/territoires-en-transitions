name: docker-build-push
description: Build une image Docker (BuildKit build-args/secrets/cache registre) et la pousse vers le registre

inputs:
  dockerfile:
    description: Chemin du Dockerfile (le contexte de build est toujours la racine du repo)
    required: true
  image:
    description: Chemin complet de l'image à tagger et pousser (registry/org/nom:tag)
    required: true
  cache-scope:
    description: >
      Scope du cache BuildKit dans le registre de l'image ; désactivé si vide.
      Le cache est publié sous le tag buildcache-<scope>, partagé entre les
      branches et les environnements. Garder un scope par image (tet-app,
      tet-backend, etc.) pour réutiliser les couches fetch/install pnpm.
    required: false
    default: ''
  build-args:
    description: Liste de build-args au format KEY=VALUE, une par ligne
    required: false
    default: ''
  secrets:
    description: >
      Liste de secrets BuildKit au format id=NOM_VAR_ENV, une par ligne.
      NOM_VAR_ENV doit être défini via `env:` sur l'étape qui appelle cette action.
    required: false
    default: ''
  push:
    description: Pousse l'image construite vers le registre (désactivé lors des exécutions locales via act)
    required: false
    default: 'true'
  reuse-image:
    description: >
      Réutilise l'image si son tag existe déjà dans le registre. À activer
      uniquement pour les images dont tous les inputs sont fixés par le
      commit (sans configuration d'environnement au build).
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    - name: Prépare un builder BuildKit avec driver docker-container
      # nécessaire pour --push et --cache-to type=registry : le builder par défaut
      # des runners (driver "docker") ne supporte pas ces exports.
      shell: bash
      run: docker buildx create --use --name ci-builder --driver docker-container 2>/dev/null || docker buildx use ci-builder

    - name: Build (et push) de l'image
      shell: bash
      # Les inputs passent par `env:` (plutôt que d'être interpolés via ${{ }}
      # directement dans le script) pour éviter qu'une valeur contenant des
      # guillemets ou un `$(...)` ne casse ou n'injecte dans le script shell.
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE: ${{ inputs.image }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
        BUILD_ARGS_INPUT: ${{ inputs.build-args }}
        SECRETS_INPUT: ${{ inputs.secrets }}
        PUSH: ${{ inputs.push }}
        REUSE_IMAGE: ${{ inputs.reuse-image }}
      run: |
        set -euo pipefail

        # Une promotion ou un redéploiement du même commit n'a pas besoin de
        # recompiler ni de réexporter le cache. Un registre indisponible ou un
        # tag absent laisse le build normal prendre le relais.
        if [ "$PUSH" = "true" ] && [ "$REUSE_IMAGE" = "true" ] \
          && docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
          echo "Image $IMAGE déjà publiée, réutilisation sans build."
          exit 0
        fi

        build_args=()
        while IFS= read -r line; do
          [ -n "$line" ] && build_args+=(--build-arg "$line")
        done <<< "$BUILD_ARGS_INPUT"

        # Écrites dans des fichiers (--secret id=...,src=...) plutôt que lues
        # directement depuis l'env (--secret id=...,env=...) : si un secret
        # GitHub a été enregistré avec un retour à la ligne final (ex. `gh
        # secret set` depuis un fichier avec \n de fin), pnpm/undici rejette
        # ensuite l'en-tête Authorization avec "Invalid character in header
        # content" — on neutralise ça en supprimant les espaces de début et de
        # fin avant de matérialiser le secret.
        #
        # On ne supprime QUE les bords : cette action est générique, et un
        # `tr -d '[:space:]'` détruirait silencieusement tout secret
        # multi-lignes ou contenant des espaces (clé PEM, blob JSON de compte
        # de service, passphrase), pour finir en échec d'authentification
        # incompréhensible au milieu du build.
        #
        # umask + trap : les fichiers contiennent les secrets en clair sur le
        # disque du runner. Sans ça ils restent lisibles par tous les steps
        # suivants du job (y compris les hooks `post:` d'actions tierces)
        # jusqu'à la fin du job.
        umask 077
        secret_tmpdir=$(mktemp -d)
        trap 'rm -rf "$secret_tmpdir"' EXIT
        secret_args=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            id="${line%%=*}"
            var_name="${line#*=}"
            secret_file="$secret_tmpdir/$id"
            value="${!var_name}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value" > "$secret_file"
            secret_args+=(--secret "id=$id,src=$secret_file")
          fi
        done <<< "$SECRETS_INPUT"

        cache_args=()
        output_args=()
        if [ "$PUSH" = "true" ]; then
          output_args+=(--push)
          if [ -n "$CACHE_SCOPE" ]; then
            # GHCR partage le cache entre branches sans concurrencer les
            # caches de la CI dans le quota Actions. mode=max conserve les
            # couches intermédiaires fetch/install du build multi-stage ;
            # zstd niveau 1 réduit le coût de compression des grosses couches.
            # Une erreur d'export de cache ne doit pas bloquer le déploiement.
            cache_ref="${IMAGE%:*}:buildcache-$CACHE_SCOPE"
            cache_args+=(--cache-from "type=registry,ref=$cache_ref")
            cache_args+=(--cache-to "type=registry,ref=$cache_ref,mode=max,compression=zstd,compression-level=1,ignore-error=true")
          fi
        else
          # Sans --push ni --load, le driver docker-container jette le
          # résultat : le build local (act) ne produirait aucune image.
          output_args+=(--load)
        fi

        # --platform explicite : sans lui l'architecture suit celle du runner.
        # Koyeb tourne en amd64 ; un runner arm64 (changement de l'image
        # `ubuntu-latest`, ajout d'un runner self-hosted) produirait
        # silencieusement une image impossible à démarrer, sans erreur au build.
        docker buildx build \
          --platform linux/amd64 \
          -f "$DOCKERFILE" \
          "${build_args[@]}" \
          "${secret_args[@]}" \
          "${cache_args[@]}" \
          -t "$IMAGE" \
          "${output_args[@]}" \
          .
