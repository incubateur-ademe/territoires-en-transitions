name: cache-apt-node-canvas
description: Install and cache native system packages required by node-canvas

runs:
  using: composite

  steps:
    - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: >
          build-essential
          pkg-config
          libcairo2-dev
          libpango1.0-dev
          libjpeg-dev
          libgif-dev
          librsvg2-dev
        version: '1'