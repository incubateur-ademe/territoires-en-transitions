name: supabase-start
description: Start supabase services and export env

inputs:
  network:
    description: Docker network
    required: true
  pull:
    description: Pull image from the registry
    required: false
  api-url:
    description: Optional Supabase API base URL used to wait for REST and Auth readiness
    required: false
    default: ''

outputs:
  started:
    description: 'Tells if supabase is started (yes|no)'
    value: ${{ steps.is_started.outputs.started }}
  restored:
    description: "Contains 'success' if db volume was successfully restored"
    value: ${{ steps.restore.outputs.restored }}

runs:
  using: composite

  steps:
    - uses: supabase/setup-cli@v3.0.0
      with:
        version: 2.58.5

    - name: Try to restore db volume
      id: restore
      uses: ./.github/actions/db-restore
      with:
        pull: ${{ inputs.pull }}

    - name: Check if supabase is started
      id: is_started
      uses: ./.github/actions/supabase-is-started

    - name: Start services
      if: ${{ steps.is_started.outputs.started == 'no' }}
      shell: bash
      run: >
        supabase start
        --exclude imgproxy,postgres-meta,logflare,vector,supavisor,studio
        --network-id ${{ inputs.network }}

    - name: Wait for REST API
      if: ${{ inputs.api-url != '' }}
      uses: ./.github/actions/wait-for-url
      with:
        url: ${{ inputs.api-url }}/rest/v1/
        retry: '60'
        retry_delay: '2'

    - name: Wait for Auth API
      if: ${{ inputs.api-url != '' }}
      uses: ./.github/actions/wait-for-url
      with:
        url: ${{ inputs.api-url }}/auth/v1/health
        retry: '60'
        retry_delay: '2'
