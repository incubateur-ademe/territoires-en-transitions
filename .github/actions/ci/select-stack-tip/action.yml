name: select-stack-tip
description: Run CI on ready stack tips that cover their ancestors, including the full diff from the default branch

outputs:
  run-ci:
    description: Whether this PR needs the shared CI workflow
    value: ${{ steps.select.outputs.run-ci }}
  nx-base:
    description: Merge base with the default branch, covering the full stack
    value: ${{ steps.select.outputs.nx-base }}

runs:
  using: composite
  steps:
    - name: Test stack selection
      shell: bash
      run: node --test "$GITHUB_ACTION_PATH/select-stack-tip.test.mjs"

    - name: Select stack tip
      id: select
      shell: bash
      run: node "$GITHUB_ACTION_PATH/select-stack-tip.mjs"
