name: sqitch
description: |
  Run sqitch into a container with a prebuilt image to allow passing the --network option.
  The standard libpq PGOPTIONS environment variable is forwarded unchanged when callers set it.

inputs:
  command:
    description: 'Command to run'
    required: true
  target:
    description: 'Target'
    required: true
  network:
    description: Docker network
    required: true

runs:
  using: 'composite'

  steps:
    # Tag dérivé du contenu du Dockerfile, comme l'image de la base (`db-path`) :
    # une PR qui le modifie publie sous un nouveau tag au lieu d'écraser celui
    # utilisé par les autres runs, et la modification est bien prise en compte.
    - uses: ./.github/actions/truncate
      id: hash_files
      with:
        string: ${{ hashFiles('.github/actions/sqitch-local/**') }}

    - name: Get image path
      uses: ./.github/actions/docker-image-path
      id: get_image_path
      with:
        image: sqitch
        tag: ${{ steps.hash_files.outputs.result }}

    - name: Check if sqitch image exists
      uses: ./.github/actions/docker-pull
      id: image_exists
      with:
        image_path: ${{ steps.get_image_path.outputs.path }}

    # Même Dockerfile que `sqitch-local` (act) et le service `sqitch` du
    # docker-compose, dont l'entrypoint (pensé pour act) est remplacé par
    # `sqitch` au run, comme dans le docker-compose. Le push est best effort : sans `packages: write` (PR de
    # fork), l'image construite sert quand même au run courant.
    - name: Build and push if image is missing
      shell: bash
      if: ${{ steps.image_exists.outputs.result != 'success' }}
      env:
        SQITCH_IMAGE: ${{ steps.get_image_path.outputs.path }}
      run: |
        docker build --tag "$SQITCH_IMAGE" .github/actions/sqitch-local
        docker push "$SQITCH_IMAGE" || echo "::warning::Push de $SQITCH_IMAGE impossible, image utilisée localement seulement."

    # Tout `data_layer`, et pas seulement `sqitch` : un change peut inclure un
    # fichier voisin (`\ir ../../../seed/imports/...`), que sqitch ne suit pas
    # dans ses dépendances. Le monter à l'identique du service `sqitch` du
    # docker-compose évite un déploiement vert en local et rouge ici.
    - name: Execute command within image
      shell: bash
      env:
        SQITCH_COMMAND: ${{ inputs.command }}
        SQITCH_IMAGE: ${{ steps.get_image_path.outputs.path }}
        SQITCH_NETWORK: ${{ inputs.network }}
        SQITCH_TARGET: ${{ inputs.target }}
      run: |
        IFS=' ' read -r -a sqitch_command <<< "$SQITCH_COMMAND"
        if (( ${#sqitch_command[@]} == 0 )); then
          echo '::error::La commande Sqitch ne peut pas être vide.'
          exit 2
        fi

        docker run \
          --rm \
          --network "$SQITCH_NETWORK" \
          --entrypoint sqitch \
          --env PGOPTIONS \
          -v ./sqitch.conf:/sqitch.conf \
          -v ./data_layer:/data_layer \
          "$SQITCH_IMAGE" \
          "${sqitch_command[@]}" \
          --target "$SQITCH_TARGET"
