name: db-path
description: Return image path used to save/restore db volume

outputs:
  path:
    description: Full image path into the registry
    value: ${{ steps.get_image_path.outputs.path }}
  name:
    description: Image name
    value: ${{ steps.get_image_path.outputs.name }}
  tag:
    description: Image tag
    value: ${{ steps.get_image_path.outputs.tag }}

runs:
  using: composite

  steps:
    - uses: ./.github/actions/utils/truncate
      id: hash_files
      with:
        # A physical backup must match the CLI's Postgres image and configuration,
        # including its collation library, not only the application migrations.
        string: ${{ hashFiles('data_layer', 'apps/backend/**/samples/*.csv', 'supabase/config.toml', 'supabase/jwt-signing-keys.json', '.github/actions/database/supabase/start/action.yml', '.github/actions/database/supabase/save-volume/action.yml') }}

    - name: Get image path
      uses: ./.github/actions/docker/image-path
      id: get_image_path
      with:
        image: supabase_db_tet
        tag: ${{ steps.hash_files.outputs.result }}
