name: pnpm-restore
description: Restore a prepared pnpm workspace from the shared CI dependency cache

inputs:
  cache_key:
    description: Cache key produced by the prepare-workspace job
    required: true
  install_canvas_deps:
    description: Install canvas system packages on runners that execute backend code paths
    required: false
    default: 'false'

runs:
  using: composite

  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v5

    - name: Use Node.js 24
      uses: actions/setup-node@v5
      with:
        node-version: 24.18.0
        cache: pnpm

    - name: Restore installed dependencies
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: ${{ inputs.cache_key }}
        fail-on-cache-miss: true

    # node-canvas links against Cairo/Pixman shared libs at runtime.
    - if: ${{ inputs.install_canvas_deps == 'true' }}
      uses: ./.github/actions/node-canvas
