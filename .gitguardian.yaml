# Configuration GitGuardian / ggshield.
#
# Les valeurs listées ci-dessous NE SONT PAS des secrets réels : ce sont des
# identifiants de démonstration, volontairement en clair, réservés à la stack de
# développement local (docker-compose.yml). Ils ne donnent accès qu'à des
# services éphémères tournant sur la machine du dev :
#   - mots de passe / clés Postgres, pg-meta et Strapi utilisés uniquement comme
#     valeurs par défaut (`${VAR:-…}`) quand aucun .env n'est fourni ;
#   - JWT anon / service_role de démo Supabase (`iss: supabase-demo`), publics et
#     identiques à ceux de la CLI Supabase, présents dans d'anciens commits de la
#     branche (désormais déchiffrés via dotenvx au HEAD).
#
# Les vrais secrets (SUPABASE_JWT_SECRET, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY, …) sont chiffrés dans le .env racine et injectés par
# dotenvx — jamais committés en clair.
version: 2

secret:
  ignored-matches:
    - name: "dev — POSTGRES_PASSWORD par défaut (stack docker locale)"
      match: postgres
    - name: "dev — PG_META_CRYPTO_KEY par défaut"
      match: dev-crypto-key
    - name: "dev — STRAPI_API_TOKEN_SALT par défaut"
      match: dev-api-token-salt
    - name: "dev — STRAPI_ADMIN_JWT_SECRET par défaut"
      match: dev-admin-jwt-secret
    - name: "dev — STRAPI_JWT_SECRET par défaut"
      match: dev-jwt-secret
    - name: "dev — STRAPI_TRANSFER_TOKEN_SALT par défaut"
      match: dev-transfer-token-salt
    - name: "dev — JWT anon démo Supabase (iss: supabase-demo, public)"
      match: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    - name: "dev — JWT service_role démo Supabase (iss: supabase-demo, public)"
      match: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
